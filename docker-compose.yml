services:
  app:
    build: .
    env_file: .env
    volumes: [dbdata:/srv/db]
    restart: unless-stopped
  caddy:
    image: caddy:2
    # Caddy only needs the domain. It does not receive API keys or SMTP passwords.
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data"]
    depends_on: [app]
    restart: unless-stopped
volumes:
  dbdata: {}
  caddy_data: {}
