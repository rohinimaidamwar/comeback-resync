{% extends "base.html" %}{% block c %}<h1>{{c.headline}}</h1><p>{{c.about}}</p><h3>What I offer</h3><ul>{% for s in c.services %}<li>{{s}}</li>{% endfor %}</ul>
<form method="post" action="/contact" class="box"><h3>Get in touch</h3><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label>
<input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true"><label>Message<textarea name="message" rows="4" required></textarea></label><button>Send message</button></form>{% endblock %}
